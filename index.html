<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stream návrhy</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
}

.container{
    width:600px;
    margin:auto;
    padding-top:40px;
}

.card{
    background:#1c1c1c;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
    transition:0.2s;
}

.card:hover{
    transform:scale(1.02);
}

input{
    width:80%;
    padding:10px;
    border:none;
    border-radius:8px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#4caf50;
    color:white;
}

.status{
    font-size:12px;
    padding:4px 8px;
    border-radius:6px;
    display:inline-block;
}

.ok{background:green;}
.wait{background:orange;}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
</style>

</head>
<body>

<div class="container">

<div class="top">
<h2>🎥 Stream návrhy</h2>
<a href="admin.html" style="color:#aaa">Admin</a>
</div>

<form onsubmit="send(event)">
    <input id="text" placeholder="Napiš návrh...">
    <button>Odeslat</button>
</form>

<br>

<div id="list"></div>

</div>

<script>
const API = "http://78.40.210.3:4162/api.php";

// 📤 odeslat návrh
async function send(e){
    e.preventDefault();

    let text = document.getElementById("text").value;

    if(!text) return;

    await fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text })
    });

    document.getElementById("text").value = "";
    load();
}

// 📥 načíst návrhy
async function load(){
    let res = await fetch(API);
    let data = await res.json();

    let html = "";

    data.forEach(row=>{
        html += `
        <div class="card">
            <b>${escapeHtml(row.text)}</b>
            <br><br>

            <span class="status ${row.approved==1 ? "ok":"wait"}">
                ${row.approved==1 ? "SCHVÁLENO" : "ČEKÁ NA SCHVÁLENÍ"}
            </span>
        </div>`;
    });

    document.getElementById("list").innerHTML = html;
}

// 🔒 ochrana
function escapeHtml(text){
    return text.replace(/[<>"']/g, m => ({
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
    }[m]));
}

// 🔥 realtime refresh
load();
setInterval(load, 2000);
</script>

</body>
</html>
